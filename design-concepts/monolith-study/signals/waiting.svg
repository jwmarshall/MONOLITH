<svg xmlns="http://www.w3.org/2000/svg" id="signal-waiting" class="monolith-waiting" viewBox="0 0 24 24" width="24" height="24" role="img" aria-labelledby="waiting-title waiting-desc">
  <title id="waiting-title">MONOLITH hourglass — waiting</title>
  <desc id="waiting-desc">Five solid bars and squares form a stepped hourglass. The upper inner bar contracts as the lower one expands, with a falling square between them. A repeating waiting cue, not a countdown or measured progress.</desc>
  <style>
    .monolith-waiting rect{fill:currentColor;stroke:none}
    .monolith-waiting .upper{transform-origin:12px 9px;animation:var(--signal-motion,monolith-wait-upper 3000ms ease-in-out infinite)}
    .monolith-waiting .waist{animation:var(--signal-motion,monolith-wait-fall 3000ms ease-in-out infinite)}
    .monolith-waiting .lower{transform-origin:12px 15px;animation:var(--signal-motion,monolith-wait-lower 3000ms ease-in-out infinite)}
    @keyframes monolith-wait-upper{0%,12%,100%{transform:scaleX(1)}65%,80%{transform:scaleX(.3)}}
    @keyframes monolith-wait-fall{0%,12%,100%{transform:translateY(-1px);opacity:.45}35%{opacity:1}65%,80%{transform:translateY(1px);opacity:.45}}
    @keyframes monolith-wait-lower{0%,12%,100%{transform:scaleX(.3)}65%,80%{transform:scaleX(1)}}
    @media(prefers-reduced-motion:reduce){.monolith-waiting .upper,.monolith-waiting .waist,.monolith-waiting .lower{animation:none}}
    @media(forced-colors:active){.monolith-waiting rect{fill:CanvasText}}
    @media print{.monolith-waiting .upper,.monolith-waiting .waist,.monolith-waiting .lower{animation:none}}
  </style>
  <rect x="5" y="4" width="14" height="2"/>
  <rect class="upper" x="8" y="8" width="8" height="2"/>
  <rect class="waist" x="11" y="11" width="2" height="2"/>
  <rect class="lower" x="8" y="14" width="8" height="2"/>
  <rect x="5" y="18" width="14" height="2"/>
</svg>
