<svg xmlns="http://www.w3.org/2000/svg" id="signal-loading" class="monolith-loading" viewBox="0 0 24 24" width="24" height="24" role="img" aria-labelledby="loading-title loading-desc">
  <title id="loading-title">MONOLITH spinner — loading</title>
  <desc id="loading-desc">Four stationary squares form a compact loading signal. Light travels clockwise between them while a read is pending. Activity only, never a percentage or completion time.</desc>
  <style>
    .monolith-loading rect{fill:currentColor;stroke:none;opacity:1;animation:var(--signal-motion,monolith-square-cycle 2400ms linear infinite)}
    .monolith-loading .northeast{animation-delay:-1800ms}
    .monolith-loading .southeast{animation-delay:-1200ms}
    .monolith-loading .southwest{animation-delay:-600ms}
    @keyframes monolith-square-cycle{0%,100%{opacity:1}25%,75%{opacity:.3}}
    @media(prefers-reduced-motion:reduce){.monolith-loading rect{animation:none}}
    @media(forced-colors:active){.monolith-loading rect{fill:CanvasText}}
    @media print{.monolith-loading rect{animation:none}}
  </style>
  <rect class="northwest" x="5" y="5" width="5" height="5"/>
  <rect class="northeast" x="14" y="5" width="5" height="5"/>
  <rect class="southeast" x="14" y="14" width="5" height="5"/>
  <rect class="southwest" x="5" y="14" width="5" height="5"/>
</svg>
