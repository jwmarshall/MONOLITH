<svg xmlns="http://www.w3.org/2000/svg" id="signal-healthy" class="monolith-healthy" viewBox="0 0 24 24" width="24" height="24" role="img" aria-labelledby="healthy-title healthy-desc">
  <title id="healthy-title">MONOLITH check — healthy</title>
  <desc id="healthy-desc">Two solid, square-ended bars form a complete check with no surrounding frame. The whole check gently lifts and settles every 3.6 seconds, remaining fully visible beside an observed-success label.</desc>
  <style>
    .monolith-healthy path{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:square}
    .monolith-healthy .check{animation:var(--signal-motion,monolith-check-settle 3600ms ease-in-out infinite)}
    @keyframes monolith-check-settle{0%,65%,100%{transform:translateY(0)}35%,45%{transform:translateY(-.75px)}}
    @media(prefers-reduced-motion:reduce){.monolith-healthy .check{animation:none}}
    @media(forced-colors:active){.monolith-healthy path{stroke:CanvasText}}
    @media print{.monolith-healthy .check{animation:none}}
  </style>
  <g class="check">
    <path d="M5 12L10 17"/>
    <path d="M10 17L19 8"/>
  </g>
</svg>
