<svg xmlns="http://www.w3.org/2000/svg" id="signal-unknown" class="monolith-unknown" viewBox="0 0 24 24" width="24" height="24" role="img" aria-labelledby="unknown-title unknown-desc">
  <title id="unknown-title">MONOLITH question — unknown</title>
  <desc id="unknown-desc">A right-angled question hook rocks to either side while its detached square dot lifts and settles. No trustworthy observation exists; this questioning gesture implies neither polling nor progress.</desc>
  <style>
    .monolith-unknown path{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:square;stroke-linejoin:miter}
    .monolith-unknown rect{fill:currentColor;stroke:none}
    .monolith-unknown .hook{transform-origin:12px 14px;animation:var(--signal-motion,monolith-question-hook 3600ms ease-in-out infinite)}
    .monolith-unknown .dot{animation:var(--signal-motion,monolith-question-dot 3600ms ease-in-out infinite)}
    @keyframes monolith-question-hook{0%,15%,85%,100%{transform:rotate(0deg)}35%{transform:rotate(-10deg)}60%{transform:rotate(7deg)}}
    @keyframes monolith-question-dot{0%,15%,85%,100%{transform:translateY(0);opacity:1}35%,60%{transform:translateY(-1.25px);opacity:.55}}
    @media(prefers-reduced-motion:reduce){.monolith-unknown .hook,.monolith-unknown .dot{animation:none}}
    @media(forced-colors:active){.monolith-unknown path{stroke:CanvasText}.monolith-unknown rect{fill:CanvasText}}
    @media print{.monolith-unknown .hook,.monolith-unknown .dot{animation:none}}
  </style>
  <path class="hook" d="M7 8V5H17V11H12V14"/>
  <rect class="dot" x="11" y="18" width="2" height="2"/>
</svg>
