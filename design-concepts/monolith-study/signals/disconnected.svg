<svg xmlns="http://www.w3.org/2000/svg" id="signal-disconnected" class="monolith-disconnected" viewBox="0 0 24 24" width="24" height="24" role="img" aria-labelledby="disconnected-title disconnected-desc">
  <title id="disconnected-title">MONOLITH broken link — disconnected</title>
  <desc id="disconnected-desc">Two opposing three-sided brackets and short connector bars gently ease farther apart and return in a repeating cycle. A permanent gap always breaks the central connection, even at their closest point. Access needs reconnection, not merely a read retry.</desc>
  <style>
    .monolith-disconnected path{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:square;stroke-linejoin:miter}
    .monolith-disconnected .left{animation:var(--signal-motion,monolith-break-left 3600ms ease-in-out infinite)}
    .monolith-disconnected .right{animation:var(--signal-motion,monolith-break-right 3600ms ease-in-out infinite)}
    @keyframes monolith-break-left{0%,100%{transform:translateX(0)}45%,60%{transform:translateX(-.75px)}}
    @keyframes monolith-break-right{0%,100%{transform:translateX(0)}45%,60%{transform:translateX(.75px)}}
    @media(prefers-reduced-motion:reduce){.monolith-disconnected .left,.monolith-disconnected .right{animation:none}}
    @media(forced-colors:active){.monolith-disconnected path{stroke:CanvasText}}
    @media print{.monolith-disconnected .left,.monolith-disconnected .right{animation:none}}
  </style>
  <path class="left" d="M9 6H4V18H9M7 12H10"/>
  <path class="right" d="M15 6H20V18H15M14 12H17"/>
</svg>
