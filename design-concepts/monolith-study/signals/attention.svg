<svg xmlns="http://www.w3.org/2000/svg" id="signal-attention" class="monolith-attention" viewBox="0 0 24 24" width="24" height="24" role="img" aria-labelledby="attention-title attention-desc">
  <title id="attention-title">MONOLITH warning — attention</title>
  <desc id="attention-desc">A complete clipped warning triangle stays still while its exclamation mark lifts twice, then rests. The repeating double pulse calls attention without hiding the warning shape. The adjacent label explains what needs attention.</desc>
  <style>
    .monolith-attention path{fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:square;stroke-linejoin:miter}
    .monolith-attention .exclamation{animation:var(--signal-motion,monolith-warning-cue 3000ms ease-in-out infinite)}
    @keyframes monolith-warning-cue{0%,12%,36%,60%,100%{transform:translateY(0);opacity:1}24%,48%{transform:translateY(-1.25px);opacity:.6}}
    @media(prefers-reduced-motion:reduce){.monolith-attention .exclamation{animation:none}}
    @media(forced-colors:active){.monolith-attention path{stroke:CanvasText}}
    @media print{.monolith-attention .exclamation{animation:none}}
  </style>
  <path class="triangle" pathLength="1" d="M11 3H13L22 19L21 21H3L2 19Z"/>
  <path class="exclamation" d="M12 9V14M12 18V18.01"/>
</svg>
