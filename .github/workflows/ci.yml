name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Quality, tests, and security
    runs-on: ubuntu-latest
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict
      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-beam-${{ hashFiles('.tool-versions', 'mix.lock', 'config/**', '.formatter.exs') }}
      - name: Fetch dependencies
        run: mix deps.get
      - name: Install asset tools
        run: mix assets.setup
      - name: Check formatting, compilation, Credo, Sobelow, tests, and assets
        run: mix check
      - name: Check dependency advisories and retired Hex packages
        run: mix audit
